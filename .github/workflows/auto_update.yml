name: Auto Update Content

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 핵심 해결책: 전체 기록을 가져와서 충돌을 원천 차단합니다!

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser

      - name: Run update script
        run: python update_site.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          
          # 1. 변경된 내용이 없으면 조용히 종료
          git diff --quiet && git diff --staged --quiet && exit 0
          
          # 2. 변경된 내용이 있으면 저장소에 기록
          git commit -m "🤖 자동 업데이트: 최신 뉴스, 블로그, 유튜브 반영 완료"
          
          # 3. 최신 원본을 당겨와서 안전하게 합치기
          git pull --rebase origin main
          
          # 4. 최종적으로 홈페이지에 밀어넣기
          git push origin main
