name: Auto Update Content

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser

      - name: Run update script
        run: python update_site.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          # 충돌 방지: 밀어넣기 전에 최신 코드를 먼저 당겨옵니다(pull rebase)
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 자동 업데이트: 최신 뉴스, 블로그, 유튜브 반영 완료" && git pull --rebase origin main && git push)
```eof

이렇게 스케줄러를 업데이트해 두시고, **[Actions]**에서 한 번 돌려주시면 이제 정말 100% 완벽하게 홈페이지에 뉴스와 블로그가 예쁘게 착! 달라붙어 있을 것입니다. 확인해 보시고 결과 알려주세요!
